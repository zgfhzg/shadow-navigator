<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow · 실제 지도 연결</title><link rel="stylesheet" href="live.css"></head><body><header><a href="./">← Shadow</a><span>실제 지도 연결</span></header><main><section class="controls"><h1>홍콩과 일본에서<br>다음 산책을 준비하세요.</h1><label>지역<select id="city"></select></label><p id="clock"></p><label>이동 수단<select id="mode"><option value="walk">도보</option><option value="bike">자전거</option></select></label><form id="places"><label>출발지<input id="start-query" required minlength="2" placeholder="Central Station"></label><button>출발지 검색</button><select id="start" aria-label="출발지 검색 결과" required></select></form><form id="destination"><label>도착지<input id="end-query" required minlength="2" placeholder="Hong Kong Park"></label><button>도착지 검색</button><select id="end" aria-label="도착지 검색 결과" required></select></form><button id="route" disabled>실제 경로 찾기</button><p id="status" role="status">연결 설정을 확인하고 있습니다.</p><div id="results"></div><p id="buildings" role="status"></p><p class="note">현재 화면은 일반 도보·자전거 경로입니다. 실제 건물 그림자 계산과 그늘 경로 비교는 아직 연결되지 않았습니다.</p><p class="note">검색어와 경로 좌표는 지도 서비스에 전달됩니다. 건물 높이가 없는 곳은 임의 높이로 대체하지 않습니다.</p></section><section id="map" aria-label="실제 지도"></section></main><footer>지도 © MapTiler © OpenStreetMap contributors · 경로 GraphHopper · 건물 <a href="https://docs.overturemaps.org/attribution/">Overture Maps / ODbL</a></footer><script type="module" src="live.mjs"></script></body></html>
