<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow · 자체 경로 엔진</title><link rel="stylesheet" href="live.css"><style>svg{width:100%;height:100%;min-height:500px}#map{position:relative}.road{stroke:#bcc6d7;stroke-width:1;fill:none}.bridge{stroke:#9079b7}.selected{stroke:#3563f3;stroke-width:4;fill:none}#details{line-height:1.7;font-size:13px}.dot{fill:#3563f3}#node-search{margin-bottom:10px}</style></head><body><header><a href="./">← Shadow</a><span>자체 경로 엔진 · 홍콩 시범 구역</span></header><main><section class="controls"><h1>실제 도로로<br>엔진 검증하기.</h1><p>MapTiler 키 없이 도로 연결과 층 이동을 확인하는 화면입니다.</p><label>노드 필터<input id="node-search" placeholder="도로명, floor:1, 노드 번호"></label><label>출발 노드<select id="start"></select></label><label>도착 노드<select id="end"></select></label><label>이동 수단<select id="mode"><option value="walk">도보</option><option value="bike">자전거</option></select></label><label><span><input type="checkbox" id="avoid" style="width:auto"> 계단 피하기</span></label><button id="find" disabled>자체 엔진으로 찾기</button><p id="status" role="status">도로망을 불러오고 있습니다.</p><div id="details"></div><p class="note">보라색은 육교 구간입니다. 배경 지도 없이 OSM 도로 형상만 표시합니다. 현장 검증·그늘 평가·시간대별 출입 제한은 아직 지원하지 않습니다. 계단 피하기는 휠체어 접근성을 보장하지 않습니다.</p></section><section id="map" aria-label="홍콩 도로망과 계산 경로"><svg id="network" viewBox="0 0 1000 700" role="img" aria-label="OSM 도로망 경로 검증"><g id="roads"></g><g id="path"></g></svg></section></main><footer>© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors · ODbL</a> · Shadow 자체 경로 엔진</footer><script type="module" src="routing.mjs"></script></body></html>
